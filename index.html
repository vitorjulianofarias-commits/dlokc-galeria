<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080808"><title>D’LOKC — Galeria</title><style>
:root{--bg:#080808;--fg:#f5f5f5;--red:#e51b35;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:16px}.brand{font-size:34px;font-weight:900;letter-spacing:-1.5px}.brand span{color:var(--red)}.tag{text-align:right;font-size:10px;letter-spacing:2px;color:var(--muted)}.eyebrow{margin:28px 0 8px;color:var(--red);font-size:10px;letter-spacing:3px;font-weight:bold}h1{font-size:clamp(44px,8vw,84px);line-height:.9;letter-spacing:-3px;margin:0}.intro{max-width:560px;color:#bbb;font-size:12px;line-height:1.7;margin:14px 0 22px}.carousel{position:relative;aspect-ratio:16/8.5;overflow:hidden;background:#161616;border:1px solid #292929}.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;pointer-events:none}.slide.active{opacity:1;pointer-events:auto}.slide img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85)}.slide:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.78))}.caption{position:absolute;z-index:2;left:22px;bottom:22px;font-size:clamp(16px,3vw,28px);font-weight:bold;letter-spacing:1px}.caption small{display:block;color:var(--red);font-size:10px;letter-spacing:3px;margin-bottom:7px}.arrow{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:42px;height:42px;border:1px solid #aaa;background:#0009;color:white;font-size:30px;cursor:pointer}.arrow:hover{background:var(--red)}.prev{left:14px}.next{right:14px}.controls{display:flex;align-items:center;justify-content:space-between;padding:12px 0 18px;border-bottom:1px solid #333}.dots{display:flex;gap:6px}.dot{width:18px;height:3px;border:0;background:#666;padding:0;cursor:pointer}.dot.active{background:var(--red);width:28px}.counter{font-size:10px;letter-spacing:2px;color:var(--muted)}.gridtitle{display:flex;justify-content:space-between;align-items:end;margin:22px 0 12px;gap:12px}.gridtitle h2{font-size:16px;letter-spacing:2px;margin:0}.gridtitle p{font-size:10px;color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.thumb{border:0;background:#161616;padding:0;aspect-ratio:4/3;overflow:hidden;cursor:pointer}.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s;filter:saturate(.8)}.thumb:hover img{transform:scale(1.04)}footer{display:flex;justify-content:space-between;gap:15px;border-top:1px solid #333;margin-top:24px;padding-top:14px;color:var(--muted);font-size:9px;letter-spacing:2px}@media(max-width:650px){.wrap{padding:16px}.carousel{aspect-ratio:4/5}.arrow{width:36px;height:36px}.caption{left:15px;bottom:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{letter-spacing:-2px}}@media(prefers-reduced-motion:reduce){.slide,.thumb img{transition:none}}
</style></head><body><div class="wrap"><header><div class="brand">D’LOKC<span>★</span></div><div class="tag">RAP · REGGAETON · AFROBEAT<br>PORTO ALEGRE — BRASIL</div></header><div class="eyebrow">PHOTO GALLERY / 001</div><h1>GALERIA</h1><p class="intro">PALCO, ESTÚDIO, BASTIDORES E MOMENTOS QUE CONSTROEM A HISTÓRIA DO D’LOKC.</p><section class="carousel" aria-label="Carrossel de fotos"><div id="slides"></div><button class="arrow prev" aria-label="Foto anterior">‹</button><button class="arrow next" aria-label="Próxima foto">›</button></section><div class="controls"><div class="dots" id="dots"></div><div class="counter" id="counter">01 / 01</div></div><div class="gridtitle"><h2>FOTOS / SELEÇÃO</h2><p>CLIQUE EM UMA FOTO PARA EXIBIR</p></div><div class="grid" id="grid"></div><footer><span>MÚSICA · RUA · IDENTIDADE · MOVIMENTO</span><span>D’LOKC / OFFICIAL</span></footer></div>
<script>
const photos=["images/foto01.jpg", "images/foto02.jpg", "images/foto03.jpg", "images/foto04.jpg", "images/foto05.jpg", "images/foto06.jpg", "images/foto07.jpg", "images/foto08.jpg", "images/foto09.jpg", "images/foto10.jpg"];let index=0,timer;const slides=document.getElementById('slides'),dots=document.getElementById('dots'),counter=document.getElementById('counter'),grid=document.getElementById('grid');
if(!photos.length){slides.textContent='Adicione fotos à pasta images e atualize a lista photos no index.html.';counter.textContent='00 / 00'}else{
photos.forEach((src,i)=>{let s=document.createElement('div');s.className='slide'+(i===0?' active':'');let im=document.createElement('img');im.src=src;im.alt='Foto D’LOKC '+(i+1);im.loading=i===0?'eager':'lazy';let cap=document.createElement('div');cap.className='caption';cap.innerHTML='<small>D’LOKC / '+String(i+1).padStart(2,'0')+'</small>'+['LIVE PERFORMANCE','EDITORIAL','BACKSTAGE','D’LOKC / VISUAL'][i%4];s.append(im,cap);slides.append(s);let d=document.createElement('button');d.className='dot'+(i===0?' active':'');d.setAttribute('aria-label','Ir para foto '+(i+1));d.onclick=()=>show(i);dots.append(d);let t=document.createElement('button');t.className='thumb';let ti=document.createElement('img');ti.src=src;ti.alt='Miniatura '+(i+1);ti.loading='lazy';t.append(ti);t.onclick=()=>{show(i);window.scrollTo({top:0,behavior:'smooth'})};grid.append(t)});
let ss=[...document.querySelectorAll('.slide')],dd=[...document.querySelectorAll('.dot')];function render(){ss.forEach((e,i)=>e.classList.toggle('active',i===index));dd.forEach((e,i)=>e.classList.toggle('active',i===index));counter.textContent=String(index+1).padStart(2,'0')+' / '+String(photos.length).padStart(2,'0')}function show(n){index=(n+photos.length)%photos.length;render();reset()}function tick(){index=(index+1)%photos.length;render()}function reset(){clearInterval(timer);timer=setInterval(tick,4500)}document.querySelector('.prev').onclick=()=>show(index-1);document.querySelector('.next').onclick=()=>show(index+1);let c=document.querySelector('.carousel');c.onmouseenter=()=>clearInterval(timer);c.onmouseleave=reset;c.onfocusin=()=>clearInterval(timer);c.onfocusout=reset;let tx=0;c.addEventListener('touchstart',e=>tx=e.changedTouches[0].screenX,{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-tx;if(Math.abs(dx)>45)show(index+(dx<0?1:-1))},{passive:true});reset()}
</script></body></html>
